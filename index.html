<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satoz Diary v13.1 Sync</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit, addDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3nZEh7H-3HdUSJ3KfUu1e2HNgYTa6yRs",
            authDomain: "satoz-diary.firebaseapp.com",
            projectId: "satoz-diary",
            storageBucket: "satoz-diary.firebasestorage.app",
            messagingSenderId: "596323639753",
            appId: "1:596323639753:web:f4c4a93d1573eb8ab28818"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 外部からFirebaseを操作する窓口
        window.cloud = {
            login: () => signInWithPopup(auth, provider),
            logout: () => signOut(auth),
            // 全データをサーバーに保存
            saveAllData: async (uid, data) => {
                await setDoc(doc(db, "users", uid), data);
            },
            // 投稿をタイムラインに送る
            postTimeline: async (post) => {
                await addDoc(collection(db, "timeline"), { ...post, createdAt: Date.now() });
            }
        };

        // ログイン状態の監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("Logged in as:", user.displayName);
                // サーバーからデータを取得
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    window.dbData = docSnap.data();
                } else {
                    // 初回ログイン時は初期データを作成
                    window.dbData.user.name = user.displayName;
                    window.dbData.user.id = user.uid;
                    window.dbData.user.avatar = user.photoURL;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-shell').style.display = 'block';
                initApp();
                listenTimeline();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-shell').style.display = 'none';
            }
        });

        // 共通タイムラインの監視
        function listenTimeline() {
            const q = query(collection(db, "timeline"), orderBy("createdAt", "desc"), limit(30));
            onSnapshot(q, (snapshot) => {
                const posts = snapshot.docs.map(doc => doc.data());
                renderTimeline(posts);
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --apple-bg: #f5f5f7; --apple-card: rgba(255, 255, 255, 0.85); --apple-text: #1d1d1f; --apple-accent: #0071e3; --glass: blur(25px) saturate(180%); }
        [data-theme="dark"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; }
        body { background-color: var(--apple-bg); color: var(--apple-text); font-family: -apple-system, sans-serif; padding-bottom: 100px; transition: 0.3s; overflow-x: hidden; }
        .glass-card { background: var(--apple-card); backdrop-filter: var(--glass); border-radius: 22px; border: 1px solid rgba(120, 120, 120, 0.1); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--apple-card); backdrop-filter: blur(25px); border-top: 0.5px solid rgba(120,120,120,0.2); display: flex; align-items: center; z-index: 9999; }
        .nav-item { color: #86868b; flex: 1; text-align: center; font-size: 8px; font-weight: bold; background: none; }
        .nav-item.active { color: var(--apple-accent); }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen" class="fixed inset-0 z-[10000] bg-white dark:bg-black flex flex-col items-center justify-center text-center p-10">
        <h1 class="text-4xl font-black text-blue-600 mb-2">Satoz Diary</h1>
        <p class="text-gray-400 mb-10">スマホとPCでデータを同期</p>
        <button onclick="window.cloud.login()" class="w-full max-w-xs bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">Googleでログイン</button>
    </div>

    <!-- アプリ本体 -->
    <div id="app-shell" style="display:none;">
        <header class="p-5 flex justify-between items-center sticky top-0 z-50 bg-opacity-70 backdrop-blur-md">
            <h1 class="text-lg font-black italic text-blue-600">Satoz Diary</h1>
            <div id="realtime-clock" class="text-xs font-bold px-3 py-1 bg-black/5 dark:bg-white/10 rounded-full">00:00:00</div>
        </header>

        <main class="max-w-md mx-auto px-4">
            <!-- 記録・予定 -->
            <section id="home" class="view-section active">
                <div class="glass-card p-5 mb-6 border-l-8 border-yellow-400 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-sm">今日の予定</h2>
                        <button onclick="openInput('schedule')" class="text-[10px] bg-yellow-500 text-white px-3 py-1 rounded-full font-bold">+ 追加</button>
                    </div>
                    <div id="todo-display-list" class="space-y-3"></div>
                </div>
                <div id="category-grid" class="grid grid-cols-4 gap-3 mb-6"></div>
                
                <div id="input-area" class="glass-card p-6 mb-6 hidden border-2 border-blue-500/20">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="input-title" class="font-bold text-lg text-blue-500"></h3>
                        <div onclick="closeInput()" class="cursor-pointer text-xl">×</div>
                    </div>
                    <div id="dynamic-fields" class="space-y-4"></div>
                    <textarea id="rec-comment" placeholder="メモを一言" rows="2" class="mt-4 w-full text-xs"></textarea>
                    <button onclick="saveRecord()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg">同期して保存</button>
                </div>
            </section>

            <!-- タイムライン -->
            <section id="timeline" class="view-section">
                <h2 class="text-xl font-black mb-6 italic text-blue-600">Timeline</h2>
                <div id="feed-list" class="space-y-4"></div>
            </section>

            <!-- 結果、順位、本人セクションはVer11と同じロジックをJSに含めています -->
        </main>

        <nav class="tab-bar">
            <button onclick="showSection('home')" class="nav-item active"><i class="bi bi-pencil-square text-lg"></i><div>記録</div></button>
            <button onclick="showSection('timeline')" class="nav-item"><i class="bi bi-chat-dots text-lg"></i><div>TL</div></button>
            <button onclick="showSection('results')" class="nav-item"><i class="bi bi-journal-check text-lg"></i><div>結果</div></button>
            <button onclick="showSection('ranking')" class="nav-item"><i class="bi bi-bar-chart-fill text-lg"></i><div>順位</div></button>
            <button onclick="showSection('profile')" class="nav-item"><i class="bi bi-person-circle text-lg"></i><div>本人</div></button>
        </nav>
    </div>

    <script>
    // --- 1. データ管理エンジン ---
    window.dbData = JSON.parse(localStorage.getItem('sz_v13_db')) || {
        user: { name: "", id: "", avatar: null, weight: 65, height: 170, age: 20 },
        records: [],
        todos: [],
        cats: []
    };

    const baseCats = [
        { id:'weight', name:'体重', icon:'bi-speedometer2', color:'#444', type:'weight', unit:'kg' },
        { id:'meal', name:'食事', icon:'bi-egg-fried', color:'#34c759', type:'val', unit:'kcal' },
        { id:'study', name:'勉強', icon:'bi-book', color:'#0071e3', type:'time', unit:'時間', mets:2.0 },
        { id:'exercise', name:'運動', icon:'bi-fire', color:'#ff9500', type:'time', unit:'時間', mets:5.0 },
        { id:'run', name:'ランニング', icon:'bi-person-walking', color:'#ff3b30', type:'run', unit:'km', mets:8.3 },
        { id:'diary', name:'日記', icon:'bi-chat-quote', color:'#000', type:'diary', unit:'文字' },
        { id:'sleep', name:'睡眠', icon:'bi-moon-stars', color:'#af52de', type:'sleep', unit:'時間', mets:0.9 }
    ];

    // --- 2. 初期化と描画 ---
    function initApp() {
        renderCategories();
        renderAll();
        renderResultsView();
        setInterval(() => {
            const clock = document.getElementById('realtime-clock');
            if(clock) clock.innerText = new Date().toLocaleTimeString('ja-JP');
        }, 1000);
    }

    function renderCategories() {
        const grid = document.getElementById('category-grid');
        if(!grid) return;
        grid.innerHTML = baseCats.map(c => `
            <button onclick="openInput('${c.id}')" class="glass-card p-3 flex flex-col items-center active:scale-95 transition">
                <i class="${c.icon} text-lg mb-1" style="color:${c.color}"></i>
                <span class="text-[9px] font-bold">${c.name}</span>
            </button>
        `).join('');
    }

    function openInput(id) {
        window.currentCatId = id;
        const cat = baseCats.find(c => c.id === id);
        document.getElementById('input-area').classList.remove('hidden');
        document.getElementById('input-title').innerText = cat ? cat.name : "予定";
        
        document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('rec-time').value = new Date().toTimeString().slice(0,5);

        const fields = document.getElementById('dynamic-fields');
        const calView = document.getElementById('calorie-preview');
        fields.innerHTML = ''; 
        if(calView) calView.classList.add('hidden');

        if(id === 'study' || id === 'exercise' || id === 'run') {
            if(id === 'run') fields.innerHTML = `<input type="number" id="v_dist" placeholder="距離(km)" class="w-full mb-2" oninput="updatePreCal()">`;
            fields.innerHTML += `
                <div class="flex gap-2 justify-center items-center">
                    <input type="number" id="v_hrs" placeholder="時" class="val-input"><span>h</span>
                    <input type="number" id="v_mins" placeholder="分" class="val-input" oninput="updatePreCal()"><span>m</span>
                </div>`;
            if(calView) calView.classList.remove('hidden');
        } else if(id === 'sleep') {
            fields.innerHTML = `
                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold">
                    <div>就寝日<input type="date" id="sleep_s_date" value="${new Date().toISOString().split('T')[0]}"></div>
                    <div>時刻<input type="time" id="sleep_s_time" value="23:00"></div>
                    <div>起床日<input type="date" id="sleep_e_date" value="${new Date().toISOString().split('T')[0]}"></div>
                    <div>時刻<input type="time" id="sleep_e_time" value="07:00"></div>
                </div>`;
        } else if(id === 'schedule') {
            fields.innerHTML = `
                <select id="todo-date-sel" class="w-full mb-2"><option value="today">今日</option><option value="tomorrow">明日</option></select>
                <input type="text" id="v_task_todo" placeholder="予定内容">`;
        } else {
            fields.innerHTML = `<input type="number" id="v1" placeholder="${cat ? cat.unit : ''}を入力" class="w-full">`;
        }
    }

    function updatePreCal() {
        const h = parseFloat(document.getElementById('v_hrs')?.value || 0);
        const m = parseFloat(document.getElementById('v_mins')?.value || 0);
        const cat = baseCats.find(c => c.id === window.currentCatId);
        const calDisp = document.getElementById('cal-val');
        if(cat && calDisp) {
            const burn = Math.round(cat.mets * window.dbData.user.weight * (h + m/60) * 1.05);
            calDisp.innerText = burn;
        }
    }

    // --- 3. 保存と同期 ---
    async function saveRecord() {
        const memo = document.getElementById('rec-comment').value.trim();
        const date = document.getElementById('rec-date').value;
        const time = document.getElementById('rec-time').value;
        let val = 0;
        const cat = baseCats.find(c => c.id === window.currentCatId);

        if(window.currentCatId === 'schedule') {
            const task = document.getElementById('v_task_todo').value;
            if(!task) return;
            const sel = document.getElementById('todo-date-sel').value;
            const targetDate = (sel === 'today') ? date : new Date(new Date(date).setDate(new Date(date).getDate()+1)).toISOString().split('T')[0];
            window.dbData.todos.push({ id:Date.now(), time, task, memo, done:false, date:targetDate });
        } else {
            if(cat.type === 'time' || cat.type === 'run') {
                val = parseFloat(document.getElementById('v_hrs')?.value || 0) + (parseFloat(document.getElementById('v_mins')?.value || 0) / 60);
            } else if(window.currentCatId === 'sleep') {
                const s = new Date(document.getElementById('sleep_s_date').value + 'T' + document.getElementById('sleep_s_time').value);
                const e = new Date(document.getElementById('sleep_e_date').value + 'T' + document.getElementById('sleep_e_time').value);
                val = (e - s) / 3600000; if(val < 0) val += 24;
            } else if(window.currentCatId === 'diary') {
                val = memo.length;
            } else {
                val = parseFloat(document.getElementById('v1')?.value || 0);
            }
            if(window.currentCatId === 'weight') window.dbData.user.weight = val;

            const post = { userName: window.dbData.user.name, catName: cat.name, valDisp: val.toFixed(1) + (cat.unit || ""), comment: memo, date, time };
            window.dbData.records.unshift({ id:Date.now(), ...post, val, catId:window.currentCatId });

            if (window.cloud && window.cloud.postTimeline) await window.cloud.postTimeline(post);
        }

        if (window.cloud && window.cloud.saveAllData) {
            await window.cloud.saveAllData(window.dbData.user.id, window.dbData);
        }

        closeInput();
        renderAll();
        renderResultsView();
        alert("同期しました");
    }

    function renderResultsView() {
        const resInput = document.getElementById('results-date');
        if(!resInput) return;
        const date = resInput.value;
        const prev = new Date(new Date(date).setDate(new Date(date).getDate()-1)).toISOString().split('T')[0];
        
        document.getElementById('result-sum-grid').innerHTML = baseCats.map(c => {
            const curRecs = window.dbData.records.filter(r=>r.date===date && r.catId===c.id);
            const cur = (c.id === 'weight') ? (curRecs[0]?.val || 0) : curRecs.reduce((s,a)=>s+a.val,0);
            const old = window.dbData.records.filter(r=>r.date===prev && r.catId===c.id).reduce((s,a)=>s+a.val,0);
            const diff = cur - old;
            
            if(cur === 0) return '';
            const diffH = (diff > 0 ? `<span class="diff-plus">+${diff.toFixed(1)}</span>` : diff < 0 ? `<span class="diff-minus">${diff.toFixed(1)}</span>` : '±0');
            let valDisp = (c.type==='time' || c.id==='sleep') ? formatTime(cur) : `${cur.toFixed(1)}${c.unit}`;
            
            return `<div class="glass-card p-3 text-center"><p class="text-[8px] font-bold opacity-50 uppercase">${c.name}</p><p class="text-sm font-black text-blue-600">${valDisp}</p>${diffH}</div>`;
        }).join('');
    }

    function renderTimeline(posts) {
        const list = document.getElementById('feed-list');
        if(!list) return;
        list.innerHTML = posts.map(p => `
            <div class="glass-card p-4 text-left shadow-sm">
                <p class="text-[10px] font-bold text-blue-600 uppercase">${p.catName}・${p.userName}</p>
                <p class="todo-title">${p.valDisp}</p>
                <p class="text-[11px] opacity-80 mt-1">${p.comment || ''}</p>
                <p class="text-[8px] text-gray-400 mt-2">${p.date} ${p.time}</p>
            </div>`).join('');
    }

    function renderAll() {
        const d = new Date().toISOString().split('T')[0];
        const list = document.getElementById('todo-display-list');
        if(list) {
            list.innerHTML = window.dbData.todos.filter(t=>t.date===d).map(t => `
                <div class="flex gap-2 text-xs">
                    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${t.id})">
                    <b>${t.time}</b> ${t.task}
                </div>`).join('');
        }
    }

    function formatTime(decimalHrs) {
        const h = Math.floor(decimalHrs);
        const m = Math.round((decimalHrs - h) * 60);
        return h > 0 ? `${h}h${m}m` : `${m}m`;
    }

    function closeInput() { document.getElementById('input-area').classList.add('hidden'); }
    function toggleTodo(id) {
        const t = window.dbData.todos.find(x=>x.id===id);
        if(t) t.done = !t.done;
        saveLocalOnly();
    }
    function saveLocalOnly() {
        localStorage.setItem('sz_v13_db', JSON.stringify(window.dbData));
        renderAll();
    }

    function showSection(id) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(event) event.currentTarget.classList.add('active');
        if(id === 'results') renderResultsView();
    }
</script>
</body>
</html>
