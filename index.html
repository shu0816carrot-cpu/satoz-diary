    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit, addDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3nZEh7H-3HdUSJ3KfUu1e2HNgYTa6yRs",
            authDomain: "satoz-diary.firebaseapp.com",
            projectId: "satoz-diary",
            storageBucket: "satoz-diary.firebasestorage.app",
            messagingSenderId: "596323639753",
            appId: "1:596323639753:web:f4c4a93d1573eb8ab28818"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 外部からFirebaseを操作する窓口
        window.cloud = {
            login: () => signInWithPopup(auth, provider),
            logout: () => signOut(auth),
            // 全データをサーバーに保存
            saveAllData: async (uid, data) => {
                await setDoc(doc(dbData, "users", uid), data);
            },
            // 投稿をタイムラインに送る
            postTimeline: async (post) => {
                await addDoc(collection(dbData, "timeline"), { ...post, createdAt: Date.now() });
            }
        };

        // ログイン状態の監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("Logged in as:", user.displayName);
                // サーバーからデータを取得
                const docSnap = await getDoc(doc(dbData, "users", user.uid));
                if (docSnap.exists()) {
                    window.dbData = docSnap.data();
                } else {
                    // 初回ログイン時は初期データを作成
                    window.dbData.user.name = user.displayName;
                    window.dbData.user.id = user.uid;
                    window.dbData.user.avatar = user.photoURL;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-shell').style.display = 'block';
                initApp();
                listenTimeline();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-shell').style.display = 'none';
            }
        });

        // 共通タイムラインの監視
        function listenTimeline() {
            const q = query(collection(db, "timeline"), orderBy("createdAt", "desc"), limit(30));
            onSnapshot(q, (snapshot) => {
                const posts = snapshot.docs.map(doc => doc.data());
                renderTimeline(posts);
            });
        }
    </script>

    <script>
        // --- データ管理エンジン ---

        const baseCats = [
           { id:'weight', name:'体重', icon:'bi-speedometer2', color:'#444', type:'weight', unit:'kg' },
            { id:'meal', name:'食事', icon:'bi-egg-fried', color:'#34c759', type:'val', unit:'kcal' },
            { id:'study', name:'勉強', icon:'bi-book', color:'#0071e3', type:'time', unit:'時間', mets:2.0 },
            { id:'exercise', name:'運動', icon:'bi-fire', color:'#ff9500', type:'time', unit:'時間', mets:5.0 },
            { id:'run', name:'ランニング', icon:'bi-person-walking', color:'#ff3b30', type:'run', unit:'km', mets:8.3 },
            { id:'diary', name:'日記', icon:'bi-chat-quote', color:'#000', type:'diary', unit:'文字' },
            { id:'sleep', name:'睡眠', icon:'bi-moon-stars', color:'#af52de', type:'sleep', unit:'時間', mets:0.9 }
        ];

        
      let currentCatId = '', rankCatId = 'study', charts = {};

        // アプリ起動
        window.addEventListener('load', () => {
            initApp();
            // Firebase連携 (存在する場合)
            if(window.cloud && window.cloud.syncTimeline) {
                window.cloud.syncTimeline((posts) => {
                    const list = document.getElementById('feed-list');
                    list.innerHTML = posts.map(p => `
                        <div class="glass-card p-4 text-left shadow-sm">
                            <p class="text-[10px] font-bold text-blue-600 uppercase">${p.catName}・${p.userName}</p>
                            <p class="todo-title">${p.valDisp}</p>
                            <p class="text-[11px] opacity-80 mt-1">${p.comment || ''}</p>
                            <p class="text-[8px] text-gray-400 mt-2">${p.date} ${p.time}</p>
                        </div>`).join('');
                });
            }
        });

        function initApp() {
            const u = dbData.user;
            document.getElementById('set-name').value = u.name;
            document.getElementById('set-id').value = u.id;
            document.getElementById('set-weight').value = u.weight;
            document.getElementById('set-height').value = u.height;
            document.getElementById('set-age').value = u.age;
            document.getElementById('set-avatar-preview').src = u.avatar || `https://ui-avatars.com/api/?name=${u.name}`;
            document.getElementById('results-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rank-date').value = new Date().toISOString().split('T')[0];
            renderCategories();
            renderAll();
            renderResultsView();
            setInterval(() => document.getElementById('realtime-clock').innerText = new Date().toLocaleTimeString('ja-JP'), 1000);
        }

        // 記録保存 (Ver 11.0ロジック + Firebase)
        async function saveRecord() {
            const memo = document.getElementById('rec-comment').value.trim();
            const date = document.getElementById('rec-date').value;
            const time = document.getElementById('rec-time').value;
            let val = 0;
            const cat = [...baseCats, ...dbData.cats].find(c => c.id === currentCatId);

            if(currentCatId === 'schedule') {
                const task = document.getElementById('v_task_todo').value;
                if(!task) return;
                const sel = document.getElementById('todo-date-sel').value;
                const targetDate = (sel === 'today') ? date : new Date(new Date(date).setDate(new Date(date).getDate()+1)).toISOString().split('T')[0];
                dbData.todos.push({ id:Date.now(), time, task, memo, done:false, date:targetDate });
            } else {
                if(cat.type === 'time' || cat.type === 'run') {
                    val = parseFloat(document.getElementById('v_hrs')?.value || 0) + (parseFloat(document.getElementById('v_mins')?.value || 0) / 60);
                } else if(currentCatId === 'sleep') {
                    const s = new Date(document.getElementById('sleep_s_date').value + 'T' + document.getElementById('sleep_s_time').value);
                    const e = new Date(document.getElementById('sleep_e_date').value + 'T' + document.getElementById('sleep_e_time').value);
                    val = (e - s) / 3600000; if(val < 0) val += 24;
                } else if(currentCatId === 'diary') {
                    val = memo.length;
                } else {
                    val = parseFloat(document.getElementById('v1')?.value || 0);
                }
                
                if(currentCatId === 'weight') dbData.user.weight = val;

                const post = { id:Date.now(), catId:currentCatId, catName:cat.name, val, valDisp: val.toFixed(1) + cat.unit, date, time, comment:memo, userName: dbData.user.name };
                dbData.records.unshift(post);
                
                // Firebase送信
                if(window.cloud && window.cloud.saveRecord) {
                    await window.cloud.saveRecord(post);
                }
            }
            saveLocal();
            closeInput();
            alert("保存しました");
        }

        // --- Ver 11.0 予定繰り越し & 描画 ---
        function renderAll() {
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(new Date().setDate(new Date().getDate() + 1)).toISOString().split('T')[0];
            
            // ToDo表示 (今日・明日)
            document.getElementById('todo-display-list').innerHTML = `
                <p class="text-[10px] font-bold text-gray-400">TODAY</p>
                ${dbData.todos.filter(t=>t.date===today).map(t => `<div class="flex items-start gap-3 p-3 bg-white/40 rounded-xl shadow-sm"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${t.id})"> <div><p class="todo-title ${t.done?'todo-checked':''}">${t.task}</p><p class="todo-memo">${t.memo||''}</p></div></div>`).join('') || '<p class="text-center text-xs opacity-30">なし</p>'}
                <p class="text-[10px] font-bold text-gray-400 mt-4">TOMORROW</p>
                ${dbData.todos.filter(t=>t.date===tomorrow).map(t => `<div class="p-3 bg-white/10 rounded-xl opacity-60"><p class="todo-title">${t.task}</p></div>`).join('') || '<p class="text-center text-xs opacity-30">なし</p>'}
            `;
            document.getElementById('category-grid').innerHTML = baseCats.map(c => `<button onclick="openInput('${c.id}')" class="glass-card p-3 flex flex-col items-center"><i class="${c.icon} text-lg mb-1" style="color:${c.color}"></i><span class="text-[9px] font-bold">${c.name}</span></button>`).join('');
        }
         // --- Ver 11.0 結果画面 (合計 & 前日比) ---
        function renderResultsView() {
            const date = document.getElementById('results-date').value;
            const prev = new Date(new Date(date).setDate(new Date(date).getDate()-1)).toISOString().split('T')[0];
            const all = [...baseCats, ...dbData.cats];
            
            document.getElementById('result-sum-grid').innerHTML = all.filter(c=>c.type!=='todo').map(c => {
                const curRecs = dbData.records.filter(r=>r.date===date && r.catId===c.id);
                const cur = (c.id === 'weight') ? (curRecs[0]?.val || 0) : curRecs.reduce((s,a)=>s+a.val,0);
                const oldRecs = dbData.records.filter(r=>r.date===prev && r.catId===c.id);
                const old = (c.id === 'weight') ? (oldRecs[0]?.val || 0) : oldRecs.reduce((s,a)=>s+a.val,0);
                const diff = cur - old;
                
                let valDisp = (c.type==='time' || c.type==='run' || c.type==='sleep') ? formatTime(cur) : `${cur.toFixed(1)}${c.unit}`;
                if(c.type==='diary') valDisp = `${cur}文字`;
                const diffH = cur === 0 ? '' : (diff > 0 ? `<span class="diff-plus">+${diff.toFixed(1)}</span>` : diff < 0 ? `<span class="diff-minus">${diff.toFixed(1)}</span>` : '±0');
                
                return cur > 0 ? `<div class="glass-card p-3 text-center"><p class="text-[8px] font-bold text-gray-400 uppercase">${c.name}</p><p class="text-sm font-black text-blue-600">${valDisp}</p>${diffH}</div>` : '';
            }).join('');

            document.getElementById('result-todo-list').innerHTML = dbData.todos.filter(t=>t.date===date && t.done).map(t => `<div class="p-2 bg-green-50 text-[10px] rounded-lg">✓ ${t.task}</div>`).join('');
        }
        
        function initApp() {
            renderCategories();
            renderAll();
            setInterval(() => {
                document.getElementById('realtime-clock').innerText = new Date().toLocaleTimeString('ja-JP');
            }, 1000);
        }

        function renderCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = baseCats.map(c => `<button onclick="openInput('${c.id}')" class="glass-card p-3 flex flex-col items-center"><i class="${c.icon} text-lg mb-1" style="color:${c.color}"></i><span class="text-[9px] font-bold">${c.name}</span></button>`).join('');
        }



        function closeInput() { document.getElementById('input-area').classList.add('hidden'); }

        
            // 1. ローカルデータを更新
            window.dbData.records.unshift(newRecord);

            // 2. サーバー（Firestore）に保存
            if (window.cloud) {
                // ユーザー個別の全データを同期
                await window.cloud.saveAllData(window.dbData.user.id, window.dbData);
                // タイムラインにも流す
                await window.cloud.postTimeline(newRecord);
            }

            closeInput();
            renderAll();
            alert("クラウドと同期しました！");
        }

        function renderTimeline(posts) {
            const list = document.getElementById('feed-list');
            list.innerHTML = posts.map(p => `
                <div class="glass-card p-4">
                    <p class="text-[10px] font-bold text-blue-600 uppercase">${p.catId}・${p.userName}</p>
                    <p class="text-sm font-bold">${p.val} ${p.comment}</p>
                    <p class="text-[8px] text-gray-400 mt-1">${p.date} ${p.time}</p>
                </div>`).join('');
        }

        

        function showSection(id) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
         // --- UI補助 ---
        function openInput(id) {
            currentCatId = id;
            const cat = [...baseCats, ...dbData.cats].find(c => c.id === id);
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('input-title').innerText = cat ? cat.name : "予定";
            document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rec-time').value = new Date().toTimeString().slice(0,5);
            const fields = document.getElementById('dynamic-fields');
            fields.innerHTML = ''; document.getElementById('calorie-preview').classList.add('hidden');

            if(id === 'study' || id === 'exercise' || id === 'run') {
                if(id==='run') fields.innerHTML = `<input type="number" id="v_dist" placeholder="距離(km)" class="w-full mb-2" oninput="updatePreCal()">`;
                fields.innerHTML += `<div class="flex gap-2 justify-center items-center"><input type="number" id="v_hrs" placeholder="時" class="val-input"><span>h</span><input type="number" id="v_mins" placeholder="分" class="val-input" oninput="updatePreCal()"><span>m</span></div>`;
                document.getElementById('calorie-preview').classList.remove('hidden');
            } else if(id === 'sleep') {
                fields.innerHTML = `<div class="grid grid-cols-2 gap-2 text-[10px] font-bold"><div>就寝日<input type="date" id="sleep_s_date" value="${new Date().toISOString().split('T')[0]}"></div><div>時刻<input type="time" id="sleep_s_time" value="23:00"></div><div>起床日<input type="date" id="sleep_e_date" value="${new Date().toISOString().split('T')[0]}"></div><div>時刻<input type="time" id="sleep_e_time" value="07:00"></div></div>`;
            } else if(id === 'schedule') {
                fields.innerHTML = `<select id="todo-date-sel" class="w-full mb-2"><option value="today">今日</option><option value="tomorrow">明日</option></select><input type="text" id="v_task_todo" placeholder="予定内容 (例: 買い物)">`;
            } else {
                fields.innerHTML = `<input type="number" id="v1" placeholder="${cat ? cat.unit : ''}を入力" class="w-full">`;
            }
        }

        function formatTime(h) { const hr = Math.floor(h); const mn = Math.round((h-hr)*60); return hr>0 ? `${hr}h${mn}m` : `${mn}m`; }
        function saveLocal() { localStorage.setItem('sz_v11_db', JSON.stringify(dbData)); renderAll(); }
        function closeInput() { document.getElementById('input-area').classList.add('hidden'); }
        function toggleTodo(id) { const t=dbData.todos.find(x=>x.id===id); t.done=!t.done; saveLocal(); }
        function updatePreCal() { const h=parseFloat(document.getElementById('v_hrs')?.value||0), m=parseFloat(document.getElementById('v_mins')?.value||0); const cat=baseCats.find(c=>c.id===currentCatId); if(cat) document.getElementById('cal-val').innerText=Math.round(cat.mets*dbData.user.weight*(h+m/60)*1.05)+" kcal"; }
        function showSection(id) { document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); if(id==='ranking') updateRankList(rankCatId); if(id==='results') renderResultsView(); if(id==='profile') renderProfilePage(); renderAll(); }
        function saveSettings() { dbData.user.name=document.getElementById('set-name').value; dbData.user.id=document.getElementById('set-id').value; dbData.user.weight=parseFloat(document.getElementById('set-weight').value); saveLocal(); initApp(); alert("保存完了"); }
        function handleFile(e) { const r = new FileReader(); r.onload=(ev)=>{dbData.user.avatar=ev.target.result; document.getElementById('set-avatar-preview').src=ev.target.result;}; r.readAsDataURL(e.target.files[0]); }
        function renderProfilePage() {
            const u = dbData.user;
            document.getElementById('profile-header-area').innerHTML = `<div class="glass-card p-6 mb-6 flex flex-col items-center"><img src="${u.avatar || 'https://ui-avatars.com/api/?name='+u.name}" class="w-20 h-20 rounded-full border-4 border-white shadow-xl object-cover"><h2 class="text-xl font-black mt-4">${u.name}</h2><p class="text-[10px] text-gray-400">@${u.id}</p></div>`;
        }
        function updateRankList(id) { rankCatId=id; document.getElementById('rank-filters').innerHTML=baseCats.filter(c=>c.type!=='todo').map(c=>`<button onclick="updateRankList('${c.id}')" class="chip ${rankCatId===c.id?'active':''}">${c.name}</button>`).join(''); const myV=dbData.records.filter(r=>r.catId===id).reduce((s,a)=>s+a.val,0); document.getElementById('ranking-display').innerHTML=`<div class="flex items-center p-4 bg-white/50"><span class="w-8 font-black text-yellow-500">1</span><span class="flex-1 font-bold text-sm">あなた</span><span class="font-black text-blue-600 text-xs">${myV.toFixed(1)}</span></div>`; }
        function performSearch() {}
        function toggleNotifs() {}
        function renderPrivacyUI() {}
    </script>
</body>
</html>
