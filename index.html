    <!-- Firebase SDK (サーバー通信用) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3nZEh7H-3HdUSJ3KfUu1e2HNgYTa6yRs",
            authDomain: "satoz-diary.firebaseapp.com",
            projectId: "satoz-diary",
            storageBucket: "satoz-diary.firebasestorage.app",
            messagingSenderId: "596323639753",
            appId: "1:596323639753:web:f4c4a93d1573eb8ab28818",
            measurementId: "G-946NB26BB7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 各機能をwindowオブジェクトに登録（Ver11のロジックと繋ぐため）
        window.saveToCloud = async (userData, allData) => {
            const userRef = doc(db, "users", userData.id);
            await setDoc(userRef, { userData, allData }, { merge: true });
        };
        
        window.loadFromCloud = async (userId) => {
            const userRef = doc(db, "users", userId);
            const docSnap = await getDoc(userRef);
            return docSnap.exists() ? docSnap.data() : null;
        };

        window.postToTimeline = async (post) => {
            await addDoc(collection(db, "global_feed"), { ...post, createdAt: Date.now() });
        };

        window.syncTimeline = (callback) => {
            const q = query(collection(db, "global_feed"), orderBy("createdAt", "desc"), limit(20));
            return onSnapshot(q, (snapshot) => {
                const posts = snapshot.docs.map(doc => doc.data());
                callback(posts);
            });
        };
        
        console.log("Firebase Ver 12.0 Ready");
    </script>

        [data-theme="dark"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; }
        @media (prefers-color-scheme: dark) { [data-theme="auto"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; } }

        .glass-card { background: var(--apple-card); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border-radius: 22px; border: 1px solid rgba(120, 120, 120, 0.1); }

        .chip { white-space: nowrap; font-size: 10px; font-weight: bold; padding: 8px 16px; border-radius: 20px; background: rgba(120,120,120,0.1); }

        .todo-memo { font-size: 11px; font-weight: 500; color: #0071e3; }
        .todo-checked { opacity: 0.4; text-decoration: line-through; }

    <script>
        // --- データ同期 & Ver 11.0 ロジック復旧 ---
        let dbData = JSON.parse(localStorage.getItem('sz_v11_db') || '{"user":{"name":"Guest","id":"user_'+Date.now()+'","weight":65,"height":170,"age":20,"avatar":null},"records":[],"todos":[],"cats":[],"follows":[],"followers":[],"notifications":[],"groups":[],"dummyUsers":[]}');
        
        const baseCats = [
            { id:'weight', name:'体重', icon:'bi-speedometer2', color:'#444', type:'weight', unit:'kg' },
            { id:'meal', name:'食事', icon:'bi-egg-fried', color:'#34c759', type:'val', unit:'kcal' },
            { id:'study', name:'勉強', icon:'bi-book', color:'#0071e3', type:'time', unit:'時間', mets:2.0 },
            { id:'exercise', name:'運動', icon:'bi-fire', color:'#ff9500', type:'time', unit:'時間', mets:5.0 },
            { id:'run', name:'ランニング', icon:'bi-person-walking', color:'#ff3b30', type:'run', unit:'km', mets:8.3 },
            { id:'diary', name:'日記', icon:'bi-chat-quote', color:'#000', type:'diary', unit:'文字' },
            { id:'sleep', name:'睡眠', icon:'bi-moon-stars', color:'#af52de', type:'sleep', unit:'時間', mets:0.9 }
        ];

        let currentCatId = '', rankCatId = 'study', charts = {};

        // 起動時処理
        window.addEventListener('load', async () => {
            const cloudData = await window.loadFromCloud(dbData.user.id);
            if(cloudData) {
                dbData = cloudData.allData;
                localStorage.setItem('sz_v11_db', JSON.stringify(dbData));
            }
            initApp();
            // Firebase タイムライン監視開始
            if(window.syncTimeline) {
                window.syncTimeline((posts) => {
                    const list = document.getElementById('feed-list');
                    list.innerHTML = posts.map(p => `
                        <div class="glass-card p-4 relative shadow-sm text-left">
                            <p class="text-[10px] font-bold text-blue-600 uppercase">${p.catName}・${p.userName}</p>
                            <p class="todo-title">${p.valDisp}</p>
                            <p class="text-[11px] opacity-80 mt-1">${p.comment || ''}</p>
                            <p class="text-[8px] text-gray-400 mt-2">${p.date} ${p.time}</p>
                        </div>`).join('') || '<p class="text-center text-xs text-gray-400">フィードはありません</p>';
                });
            }
        });

        function initApp() {
            const u = dbData.user;
            document.getElementById('set-name').value = u.name;
            document.getElementById('set-id').value = u.id;
            document.getElementById('set-weight').value = u.weight;
            document.getElementById('set-height').value = u.height;
            document.getElementById('set-age').value = u.age;
            document.getElementById('set-avatar-preview').src = u.avatar || `https://ui-avatars.com/api/?name=${u.name}`;
            renderCategories();
            renderAll();
            setInterval(() => document.getElementById('realtime-clock').innerText = new Date().toLocaleTimeString('ja-JP'), 1000);
        }

        // --- Ver 11.0 記録保存 & Firebase同期 ---
        async function saveRecord() {
            const memo = document.getElementById('rec-comment').value.trim();
            const date = document.getElementById('rec-date').value;
            const time = document.getElementById('rec-time').value;
            let val = 0;

            if(currentCatId === 'schedule') {
                const task = prompt("予定の名前:");
                if(!task) return;
                dbData.todos.push({ id:Date.now(), time, task, memo, done:false, date });
            } else {
                const cat = baseCats.find(c => c.id === currentCatId);
                if(cat.type === 'time' || cat.type === 'run') {
                    val = parseFloat(document.getElementById('v_hrs')?.value || 0) + (parseFloat(document.getElementById('v_mins')?.value || 0) / 60);
                } else if(currentCatId === 'sleep') {
                    const t1 = document.getElementById('t1').value, t2 = document.getElementById('t2').value;
                    val = (new Date("1970/1/2 "+t2) - new Date("1970/1/1 "+t1)) / 3600000;
                    if(val < 0) val += 24;
                } else {
                    val = parseFloat(document.getElementById('v1')?.value || 0);
                }
                
                if(currentCatId === 'weight') dbData.user.weight = val;

                // 保存データ
                const post = { id:Date.now(), catId:currentCatId, catName:cat.name, val, valDisp: val.toFixed(1) + cat.unit, date, time, comment:memo, userName: dbData.user.name, userId: dbData.user.id };
                dbData.records.unshift(post);
                
                // Firebase送信
                if(window.postToTimeline) window.postToTimeline(post);
            }
            
            saveLocalAndCloud();
            closeInput();
            alert("クラウドに同期しました");
        }

        function saveLocalAndCloud() {
            localStorage.setItem('sz_v11_db', JSON.stringify(dbData));
            if(window.saveToCloud) window.saveToCloud(dbData.user, dbData);
            renderAll();
        }

        function handleFile(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                dbData.user.avatar = ev.target.result;
                document.getElementById('set-avatar-preview').src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function saveSettings() {
            dbData.user.name = document.getElementById('set-name').value;
            dbData.user.id = document.getElementById('set-id').value;
            dbData.user.weight = parseFloat(document.getElementById('set-weight').value);
            dbData.user.height = parseFloat(document.getElementById('set-height').value);
            dbData.user.age = parseInt(document.getElementById('set-age').value);
            saveLocalAndCloud();
            initApp();
            alert("設定をクラウドに保存しました");
        }

        // --- 以下 UI補助ロジック (Ver 11.0 継承) ---
        function openInput(id) {
            currentCatId = id;
            const cat = [...baseCats, ...dbData.cats].find(c => c.id === id);
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('input-title').innerText = cat ? cat.name : "予定";
            document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rec-time').value = new Date().toTimeString().slice(0,5);
            const fields = documen
