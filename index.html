<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satoz Diary v16.0 Group Custom Ranks</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <!-- Firebase SDK (Auth & Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit, addDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3nZEh7H-3HdUSJ3KfUu1e2HNgYTa6yRs",
            authDomain: "satoz-diary.firebaseapp.com",
            projectId: "satoz-diary",
            storageBucket: "satoz-diary.firebasestorage.app",
            messagingSenderId: "596323639753",
            appId: "1:596323639753:web:f4c4a93d1573eb8ab28818"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.cloud = {
            login: () => signInWithPopup(auth, provider),
            logout: () => signOut(auth),
            saveAllUserData: async (uid, data) => {
                try { 
                    await setDoc(doc(db, "users", uid), data, { merge: true });
                } catch(e) { 
                    console.error("Cloud save error:", e); 
                }
            },
            getUserData: async (uid) => {
                try {
                    const snap = await getDoc(doc(db, "users", uid));
                    return snap.exists() ? snap.data() : null;
                } catch(e) { console.error(e); return null; }
            },
            postTimeline: async (postData) => {
                try {
                    await addDoc(collection(db, "timeline"), { ...postData, createdAt: Date.now() });
                } catch(e) { console.error(e); }
            },
            listenTimeline: (callback) => {
                const q = query(collection(db, "timeline"), orderBy("createdAt", "desc"), limit(50));
                return onSnapshot(q, (snapshot) => {
                    const posts = snapshot.docs.map(doc => doc.data());
                    callback(posts);
                });
            },
            createGroup: async (groupName, user) => {
                const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                const groupData = {
                    code: code,
                    name: groupName,
                    hostUid: user.id,
                    members: [{ uid: user.id, name: user.name, avatar: user.avatar }]
                };
                await setDoc(doc(db, "groups", code), groupData);
                return { code, name: groupName };
            },
            joinGroup: async (code, user) => {
                const ref = doc(db, "groups", code.toUpperCase());
                const snap = await getDoc(ref);
                if (!snap.exists()) return { success: false, msg: "グループが見つかりません" };
                
                await updateDoc(ref, {
                    members: arrayUnion({ uid: user.id, name: user.name, avatar: user.avatar })
                });
                return { success: true, group: snap.data() };
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appShell = document.getElementById('app-shell');

            if (user) {
                const cloudData = await window.cloud.getUserData(user.uid);
                if (cloudData) window.dbData = cloudData;
                
                window.dbData.user.name = window.dbData.user.name || user.displayName || "User";
                window.dbData.user.id = user.uid;
                window.dbData.user.avatar = window.dbData.user.avatar || user.photoURL;

                saveLocal();
                await window.cloud.saveAllUserData(user.uid, window.dbData);

                loginScreen.style.display = 'none';
                appShell.style.display = 'block';

                initApp();
                window.cloud.listenTimeline((posts) => {
                    window.allPosts = posts;
                    renderTimeline();
                });
            } else {
                loginScreen.style.display = 'flex';
                appShell.style.display = 'none';
            }
        });
    </script>

    <!-- Tailwind CSS / Chart.js / Bootstrap Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root { --apple-bg: #f5f5f7; --apple-card: rgba(255, 255, 255, 0.85); --apple-text: #1d1d1f; --apple-accent: #0071e3; --glass: blur(25px) saturate(180%); }
        [data-theme="dark"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; }
        @media (prefers-color-scheme: dark) { [data-theme="auto"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; } }
        body { background-color: var(--apple-bg); color: var(--apple-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-bottom: 110px; transition: 0.3s; overflow-x: hidden; }
        .glass-card { background: var(--apple-card); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border-radius: 22px; border: 1px solid rgba(120, 120, 120, 0.1); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--apple-card); backdrop-filter: blur(25px); border-top: 0.5px solid rgba(120,120,120,0.2); display: flex; align-items: center; z-index: 9999; }
        .nav-item { color: #86868b; flex: 1; text-align: center; font-size: 9px; font-weight: bold; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--apple-accent); }
        input, select, textarea { background: rgba(120,120,120,0.1); border: none; border-radius: 12px; padding: 12px; color: inherit; outline: none; }
        .chip { white-space: nowrap; font-size: 10px; font-weight: bold; padding: 8px 16px; border-radius: 20px; background: rgba(120,120,120,0.1); }
        .chip.active { background: var(--apple-accent); color: white; }
        .todo-title { font-size: 15px; font-weight: 800; }
        .todo-memo { font-size: 11px; font-weight: 500; color: #0071e3; }
        .todo-checked { opacity: 0.4; text-decoration: line-through; }
        .diff-plus { color: #34c759; font-weight: bold; font-size: 10px; }
        .diff-minus { color: #ff3b30; font-weight: bold; font-size: 10px; }
        .val-input { font-size: 14px; width: 60px; text-align: center; border-bottom: 1px solid var(--apple-accent); }
    </style>
</head>
<body>

    <!-- 写真モーダル -->
    <div id="image-modal" class="fixed inset-0 z-[20000] bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="image-modal-img" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
        <button class="absolute top-6 right-6 text-white text-3xl font-bold cursor-pointer">×</button>
    </div>

    <!-- Google ログイン画面 -->
    <div id="login-screen" class="fixed inset-0 z-[10000] bg-white dark:bg-black flex flex-col items-center justify-center text-center p-8">
        <div class="glass-card p-8 max-w-sm w-full shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 bg-blue-600/10 text-blue-600 rounded-3xl flex items-center justify-center mb-4 text-3xl font-black italic">S</div>
            <h1 class="text-3xl font-black italic text-blue-600 mb-2">Satoz Diary</h1>
            <p class="text-xs text-gray-400 mb-8 font-medium">スマホとPCでデータをリアルタイム同期</p>
            
            <button onclick="window.cloud.login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition active:scale-95">
                <i class="bi bi-google text-lg"></i>
                <span>Googleでログイン</span>
            </button>
            <p class="text-[10px] text-gray-400 mt-6">Firebase Cloud Sync Active v16.0</p>
        </div>
    </div>

    <!-- アプリ本体 -->
    <div id="app-shell" style="display:none;">
        <header class="p-5 flex justify-between items-center sticky top-0 z-50 bg-opacity-70 backdrop-blur-md">
            <h1 class="text-lg font-black italic text-blue-600 tracking-tighter cursor-pointer" onclick="showSection('home')">Satoz Diary</h1>
            <div class="flex items-center gap-2">
                <div id="realtime-clock" class="text-xs font-bold px-3 py-1.5 bg-black/5 dark:bg-white/10 rounded-full">00:00:00</div>
                <button onclick="showSection('settings')" class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-black/10 active:scale-95 transition" title="設定">
                    <i class="bi bi-gear-fill text-sm"></i>
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4">
            
            <!-- Home (記録・予定管理) -->
            <section id="home" class="view-section active">
                <div class="glass-card p-5 mb-6 border-l-8 border-yellow-400">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-sm">予定管理 (今日・明日連動)</h2>
                        <button onclick="openInput('schedule')" class="text-[10px] bg-yellow-500 text-white px-3 py-1 rounded-full font-bold">+ 予定追加</button>
                    </div>
                    <div id="todo-display-list" class="space-y-4"></div>
                </div>

                <div id="category-grid" class="grid grid-cols-4 gap-3 mb-6"></div>

                <div id="input-area" class="glass-card p-6 mb-6 hidden border-2 border-blue-500/20">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="input-title" class="font-bold text-lg text-blue-500"></h3>
                        <div onclick="closeInput()" class="cursor-pointer text-xl font-bold">×</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-4 text-[10px] font-bold text-gray-400 uppercase">
                        <div>日付<input type="date" id="rec-date" class="w-full mt-1"></div>
                        <div>時刻<input type="time" id="rec-time" class="w-full mt-1"></div>
                    </div>

                    <div id="dynamic-fields" class="space-y-4"></div>

                    <div class="mt-4">
                        <input type="file" id="rec-photo-input" accept="image/*" class="hidden" onchange="handleRecPhotoSelect(event)">
                        <button type="button" onclick="document.getElementById('rec-photo-input').click()" class="text-xs font-bold text-blue-600 bg-blue-50 dark:bg-blue-900/30 px-3 py-2 rounded-xl flex items-center gap-1.5">
                            <i class="bi bi-camera-fill"></i>
                            <span>📷 写真を追加</span>
                        </button>
                        <div id="rec-photo-preview-box" class="hidden relative mt-2 w-24 h-24">
                            <img id="rec-photo-preview-img" class="w-24 h-24 rounded-xl object-cover border-2 border-blue-500/30">
                            <button type="button" onclick="clearRecPhoto()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold flex items-center justify-center shadow">×</button>
                        </div>
                    </div>

                    <textarea id="rec-comment" placeholder="一言メモ（任意）" rows="2" class="mt-4 w-full text-xs"></textarea>
                    
                    <div id="calorie-preview" class="hidden mt-4 p-3 bg-orange-50 dark:bg-orange-900/10 rounded-xl border border-orange-200">
                        <p class="text-[10px] font-bold text-orange-500 uppercase">カロリー計算</p>
                        <p id="cal-val" class="text-lg font-black text-orange-700 dark:text-orange-300 text-center">0 kcal</p>
                    </div>
                    
                    <button onclick="saveRecord()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg active:scale-95 transition">クラウドへ保存＆同期</button>
                </div>
                
                <button onclick="showSection('cat-maker')" class="w-full glass-card p-4 text-xs font-bold text-gray-400 border-dashed border-2 hover:bg-black/5 transition">＋ カテゴリー追加</button>
            </section>

            <!-- カテゴリー追加画面 -->
            <section id="cat-maker" class="view-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black italic">カテゴリー追加</h2>
                    <button onclick="showSection('home')" class="text-xs font-bold text-gray-400">戻る</button>
                </div>
                <div class="glass-card p-6 space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">カテゴリー名</label>
                        <input type="text" id="new-cat-name" placeholder="例: 読書, 水分補給, ピアノ" class="w-full mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block">アイコンの選択</label>
                        <div id="icon-picker" class="grid grid-cols-6 gap-2"></div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">単位の選択</label>
                        <select id="new-cat-unit-type" class="w-full mt-1" onchange="toggleCustomUnit(this.value)">
                            <option value="time">時間 (h / m)</option>
                            <option value="kcal">カロリー (kcal)</option>
                            <option value="kg">体重・重量 (kg)</option>
                            <option value="km">距離 (km)</option>
                            <option value="文字">文字数 (文字)</option>
                            <option value="回">回数 (回)</option>
                            <option value="custom">その他 (自由入力)</option>
                        </select>
                    </div>
                    <div id="custom-unit-box" class="hidden">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">単位を入力</label>
                        <input type="text" id="new-cat-custom-unit" placeholder="例: ページ, ml, 錠" class="w-full mt-1">
                    </div>
                    <button onclick="createCustomCategory()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg mt-4">カテゴリーを作成</button>
                </div>
            </section>

            <!-- Timeline (フィード) -->
            <section id="timeline" class="view-section">
                <div class="mb-4">
                    <h2 class="text-xl font-black mb-3 italic text-blue-600">Feed</h2>
                    <div id="tl-group-banner" class="flex gap-2 overflow-x-auto pb-2"></div>
                </div>
                <div id="feed-list" class="space-y-4">読み込み中...</div>
            </section>

            <!-- Results -->
            <section id="results" class="view-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black italic">Results</h2>
                    <input type="date" id="results-date" class="w-32 text-xs p-1" onchange="renderResultsView()">
                </div>
                <div id="result-sum-grid" class="grid grid-cols-2 gap-3 mb-6"></div>
                <div class="glass-card p-4">
                    <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase italic">Achievement List</h3>
                    <div id="result-todo-list" class="space-y-2"></div>
                </div>
            </section>

            <!-- Rankings (グローバル:基本カテゴリーのみ / グループ:カスタム込み) -->
            <section id="ranking" class="view-section">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-black italic">Rankings</h2>
                    <input type="date" id="rank-date" class="w-28 text-[10px]" onchange="updateRankList(rankCatId)">
                </div>
                
                <div id="rank-scope-tabs" class="flex gap-2 mb-3"></div>
                <div id="rank-filters" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-4"></div>
                <div id="ranking-display" class="glass-card overflow-hidden"></div>
            </section>

            <!-- Profile ＆ グループ -->
            <section id="profile" class="view-section">
                <div id="profile-header-area"></div>

                <div class="glass-card p-5 mb-6 space-y-4 border-2 border-blue-500/20">
                    <h3 class="text-xs font-bold text-blue-600 uppercase tracking-widest flex items-center gap-2">
                        <i class="bi bi-people-fill text-lg"></i>
                        <span>グループ機能 (6桁招待コード)</span>
                    </h3>
                    <div id="my-group-info" class="text-xs"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="handleCreateGroup()" class="bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">グループ作成</button>
                        <button onclick="handleJoinGroup()" class="bg-black/10 dark:bg-white/10 font-bold py-2.5 rounded-xl text-xs">コードで参加</button>
                    </div>
                </div>

                <div class="glass-card p-6 mb-6 text-center">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Time Allocation (24h)</h3>
                    <canvas id="profilePieChart"></canvas>
                </div>
