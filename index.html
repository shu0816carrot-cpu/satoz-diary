<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satoz Diary Ver. α.-1 Refined</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <!-- Tailwind CSS / Chart.js / Bootstrap Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root { --apple-bg: #f5f5f7; --apple-card: rgba(255, 255, 255, 0.85); --apple-text: #1d1d1f; --apple-accent: #0071e3; --glass: blur(25px) saturate(180%); }
        [data-theme="dark"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; }
        @media (prefers-color-scheme: dark) { [data-theme="auto"] { --apple-bg: #000000; --apple-card: rgba(28, 28, 30, 0.85); --apple-text: #f5f5f7; --apple-accent: #0a84ff; } }
        body { background-color: var(--apple-bg); color: var(--apple-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-bottom: 110px; transition: 0.3s; overflow-x: hidden; }
        .glass-card { background: var(--apple-card); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border-radius: 22px; border: 1px solid rgba(120, 120, 120, 0.1); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .modal-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--apple-card); backdrop-filter: blur(25px); border-top: 0.5px solid rgba(120,120,120,0.2); display: flex; align-items: center; z-index: 9999; }
        .nav-item { color: #86868b; flex: 1; text-align: center; font-size: 9px; font-weight: bold; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--apple-accent); }
        input, select, textarea { background: rgba(120,120,120,0.1); border: none; border-radius: 12px; padding: 10px; color: inherit; outline: none; }
        .chip { white-space: nowrap; font-size: 10px; font-weight: bold; padding: 8px 16px; border-radius: 20px; background: rgba(120,120,120,0.1); cursor: pointer; }
        .chip.active { background: var(--apple-accent); color: white; }
        .todo-title { font-size: 13px; font-weight: 700; }
        .todo-checked { opacity: 0.4; text-decoration: line-through; }
        .diff-plus { color: #34c759; font-weight: bold; font-size: 10px; }
        .diff-minus { color: #ff3b30; font-weight: bold; font-size: 10px; }
        .val-input { font-size: 14px; width: 60px; text-align: center; border-bottom: 1px solid var(--apple-accent); }
    </style>
</head>
<body>

    <!-- 写真拡大用モーダル -->
    <div id="image-modal" class="fixed inset-0 z-[20000] bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="window.closeImageModal()">
        <img id="image-modal-img" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
        <button class="absolute top-6 right-6 text-white text-3xl font-bold cursor-pointer">×</button>
    </div>

    <!-- 浮き出る記録・予定入力モーダル -->
    <div id="input-modal" class="fixed inset-0 z-[15000] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-card modal-pop p-6 max-w-sm w-full shadow-2xl relative max-h-[90vh] overflow-y-auto border-2 border-blue-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 id="input-title" class="font-bold text-lg text-blue-500"></h3>
                <button onclick="window.closeInput()" class="text-xl font-bold p-1">×</button>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-4 text-[10px] font-bold text-gray-400 uppercase">
                <div>日付<input type="date" id="rec-date" class="w-full mt-1"></div>
                <div>時刻<input type="time" id="rec-time" class="w-full mt-1"></div>
            </div>

            <div id="dynamic-fields" class="space-y-4"></div>

            <div class="mt-4">
                <input type="file" id="rec-photo-input" accept="image/*" class="hidden" onchange="window.handleRecPhotoSelect(event)">
                <button type="button" onclick="document.getElementById('rec-photo-input').click()" class="text-xs font-bold text-blue-600 bg-blue-50 dark:bg-blue-900/30 px-3 py-2 rounded-xl flex items-center gap-1.5">
                    <i class="bi bi-camera-fill"></i>
                    <span>📷 写真を追加</span>
                </button>
                <div id="rec-photo-preview-box" class="hidden relative mt-2 w-20 h-20">
                    <img id="rec-photo-preview-img" class="w-20 h-20 rounded-xl object-cover border-2 border-blue-500/30">
                    <button type="button" onclick="window.clearRecPhoto()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 text-xs font-bold flex items-center justify-center shadow">×</button>
                </div>
            </div>

            <textarea id="rec-comment" placeholder="一言メモ（任意）" rows="2" class="mt-4 w-full text-xs"></textarea>
            
            <div id="calorie-preview" class="hidden mt-4 p-3 bg-orange-50 dark:bg-orange-900/10 rounded-xl border border-orange-200">
                <p class="text-[10px] font-bold text-orange-500 uppercase">消費カロリー計算 (身長・体重・年齢連動)</p>
                <p id="cal-val" class="text-lg font-black text-orange-700 dark:text-orange-300 text-center">0 kcal</p>
            </div>
            
            <button onclick="window.saveRecord()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl mt-4 shadow-lg active:scale-95 transition">保存＆送信</button>
        </div>
    </div>

    <!-- 1. Google ログイン画面 -->
    <div id="login-screen" class="fixed inset-0 z-[10000] bg-white dark:bg-black flex flex-col items-center justify-center text-center p-8">
        <div class="glass-card p-8 max-w-sm w-full shadow-2xl flex flex-col items-center">
            <img src="icon.png" onerror="this.style.display='none'; document.getElementById('icon-fallback').style.display='flex';" class="w-24 h-24 rounded-3xl shadow-lg border-2 border-white/50 object-cover mb-6">
            <div id="icon-fallback" class="w-24 h-24 bg-blue-600/10 text-blue-600 rounded-3xl flex items-center justify-center mb-6 text-4xl font-black italic shadow-inner" style="display:none;">S</div>

            <h1 class="text-3xl font-black italic text-blue-600 mb-1">Satoz Diary</h1>
            <p class="text-xs font-bold text-blue-500 mb-6">Ver. α.-1</p>
            
            <button onclick="window.cloud.login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition active:scale-95 mb-3">
                <i class="bi bi-google text-lg"></i>
                <span>Googleでログイン</span>
            </button>

            <button onclick="window.demoLogin()" class="w-full bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 text-gray-700 dark:text-gray-200 font-bold py-3 px-6 rounded-2xl text-xs transition">
                👨‍💻 ゲストとして試す (デモモード)
            </button>

            <p class="text-[10px] text-gray-400 mt-6">Firebase Cloud Sync Active</p>
        </div>
    </div>

    <!-- 2. アプリ本体 -->
    <div id="app-shell" style="display:none;">
        <header class="p-5 flex justify-between items-center sticky top-0 z-50 bg-opacity-70 backdrop-blur-md">
            <h1 class="text-lg font-black italic text-blue-600 tracking-tighter cursor-pointer" onclick="window.showSection('home')">Satoz Diary</h1>
            <div class="flex items-center gap-2">
                <div id="realtime-clock" class="text-xs font-bold px-3 py-1.5 bg-black/5 dark:bg-white/10 rounded-full">00:00:00</div>
                <button onclick="window.showSection('settings')" class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-black/10 active:scale-95 transition" title="設定">
                    <i class="bi bi-gear-fill text-sm"></i>
                </button>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4">
            
            <!-- Home (記録・予定管理) -->
            <section id="home" class="view-section active">
                <div class="glass-card p-4 mb-6 border-l-6 border-yellow-400 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-xs text-gray-500 uppercase tracking-wider">スケジュール・予定</h2>
                        <div class="flex gap-1.5">
                            <button onclick="window.toggleTodoEditMode()" id="todo-edit-btn" class="text-[10px] bg-black/10 dark:bg-white/10 text-gray-700 dark:text-gray-200 px-2.5 py-1 rounded-full font-bold">✏️ 編集</button>
                            <button onclick="window.openInput('schedule')" class="text-[10px] bg-yellow-500 text-white px-2.5 py-1 rounded-full font-bold">予定追加</button>
                        </div>
                    </div>
                    <div id="todo-display-list" class="space-y-2"></div>
                </div>

                <div id="category-grid" class="grid grid-cols-4 gap-3 mb-6"></div>

                <!-- スタイリッシュな「カテゴリー追加」ボタン (プラス文字を排除) -->
                <button onclick="window.showSection('cat-maker')" class="w-full glass-card p-4 text-xs font-bold text-blue-600 border-dashed border-2 border-blue-500/30 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition flex items-center justify-center gap-2 mb-6 shadow-sm">
                    <i class="bi bi-plus-circle-fill text-lg"></i>
                    <span>カテゴリー追加</span>
                </button>
            </section>

            <!-- カテゴリー追加画面 (完全復元版) -->
            <section id="cat-maker" class="view-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black italic">カテゴリー追加</h2>
                    <button onclick="window.showSection('home')" class="text-xs font-bold text-gray-400">戻る</button>
                </div>
                <div class="glass-card p-6 space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">カテゴリー名</label>
                        <input type="text" id="new-cat-name" placeholder="例: 読書, 薬, ピアノ" class="w-full mt-1 text-xs">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block">アイコン選択</label>
                        <div id="icon-picker" class="grid grid-cols-6 gap-2"></div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">単位の選択</label>
                        <select id="new-cat-unit-type" class="w-full mt-1 text-xs" onchange="window.toggleCustomUnit(this.value)">
                            <option value="time">時間 (h / m 分割入力)</option>
                            <option value="kcal">カロリー (kcal)</option>
                            <option value="kg">重量・体重 (kg)</option>
                            <option value="km">距離 (km)</option>
                            <option value="文字">文字数 (文字)</option>
                            <option value="回">回数 (回)</option>
                            <option value="custom">その他 (自由入力)</option>
                        </select>
                    </div>
                    <div id="custom-unit-box" class="hidden">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">単位を入力</label>
                        <input type="text" id="new-cat-custom-unit" placeholder="例: 錠, ページ, ml" class="w-full mt-1 text-xs">
                    </div>
                    <button onclick="window.createCustomCategory()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg mt-4 active:scale-95 transition">カテゴリーを作成</button>
                </div>
            </section>

            <!-- Timeline -->
            <section id="timeline" class="view-section">
                <div class="mb-4">
                    <h2 class="text-xl font-black mb-3 italic text-blue-600">Feed</h2>
                    <div id="tl-group-banner" class="flex gap-2 overflow-x-auto pb-2"></div>
                </div>
                <div id="feed-list" class="space-y-4">読み込み中...</div>
            </section>

            <!-- Results -->
            <section id="results" class="view-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black italic">Results</h2>
                    <input type="date" id="results-date" class="w-32 text-xs p-1" onchange="window.renderResultsView()">
                </div>
                <div id="result-sum-grid" class="grid grid-cols-2 gap-3 mb-6"></div>
                <div class="glass-card p-4">
                    <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase italic">Achievement List</h3>
                    <div id="result-todo-list" class="space-y-2"></div>
                </div>
            </section>

            <!-- Rankings -->
            <section id="ranking" class="view-section">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-black italic">Rankings</h2>
                    <input type="date" id="rank-date" class="w-28 text-[10px]" onchange="window.updateRankList(window.rankCatId)">
                </div>
                
                <div id="rank-scope-tabs" class="flex gap-2 mb-3"></div>
                <div id="rank-filters" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-4"></div>
                <div id="ranking-display" class="glass-card overflow-hidden"></div>
            </section>

            <!-- Profile ＆ グループ -->
            <section id="profile" class="view-section">
                <div id="profile-header-area"></div>

                <div class="glass-card p-5 mb-6 space-y-4 border-2 border-blue-500/20">
                    <h3 class="text-xs font-bold text-blue-600 uppercase tracking-widest flex items-center gap-2">
                        <i class="bi bi-people-fill text-lg"></i>
                        <span>グループ機能 (6桁招待コード)</span>
                    </h3>
                    <div id="my-group-info" class="text-xs"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.handleCreateGroup()" class="bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">グループ作成</button>
                        <button onclick="window.handleJoinGroup()" class="bg-black/10 dark:bg-white/10 font-bold py-2.5 rounded-xl text-xs">コードで参加</button>
                    </div>
                </div>
            </section>

            <!-- Settings -->
            <section id="settings" class="view-section">
                <h2 class="text-xl font-bold mb-6 text-center">Settings</h2>
                <div class="glass-card p-5 space-y-4">
                    <div class="flex flex-col items-center gap-2">
                        <img id="set-avatar-preview" src="" class="w-20 h-20 rounded-full border-2 border-white shadow-lg object-cover">
                        <button onclick="document.getElementById('avatar-file').click()" class="text-xs text-blue-600 font-bold underline">アイコン変更</button>
                        <input type="file" id="avatar-file" class="hidden" accept="image/*" onchange="window.handleAvatarFileSelect(event)">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">名前</label>
                        <input type="text" id="set-name" class="w-full mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">ユーザーID (UID)</label>
                        <input type="text" id="set-id" class="w-full mt-1 opacity-70" readonly>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">体重(kg)</label>
                            <input type="number" id="set-weight" class="w-full mt-1">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">身長(cm)</label>
                            <input type="number" id="set-height" class="w-full mt-1">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">年齢</label>
                            <input type="number" id="set-age" class="w-full mt-1">
                        </div>
                    </div>
                    <button onclick="window.saveSettings()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg mt-4 active:scale-95 transition">設定を保存</button>
                    <button onclick="window.cloud.logout()" class="w-full bg-red-500/10 text-red-500 font-bold py-3 rounded-2xl mt-2">ログアウト</button>
                </div>
            </section>
        </main>

        <!-- タブバー -->
        <nav class="tab-bar">
            <button onclick="window.showSection('home')" class="nav-item active"><i class="bi bi-pencil-square text-lg"></i><div>記録</div></button>
            <button onclick="window.showSection('timeline')" class="nav-item"><i class="bi bi-chat-dots text-lg"></i><div>TL</div></button>
            <button onclick="window.showSection('results')" class="nav-item"><i class="bi bi-journal-check text-lg"></i><div>結果</div></button>
            <button onclick="window.showSection('ranking')" class="nav-item"><i class="bi bi-bar-chart-fill text-lg"></i><div>順位</div></button>
            <button onclick="window.showSection('profile')" class="nav-item"><i class="bi bi-person-circle text-lg"></i><div>本人</div></button>
        </nav>
    </div>

    <!-- Firebase ＆ アプリ完全スクリプト -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit, addDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3nZEh7H-3HdUSJ3KfUu1e2HNgYTa6yRs",
            authDomain: "satoz-diary.firebaseapp.com",
            projectId: "satoz-diary",
            storageBucket: "satoz-diary.firebasestorage.app",
            messagingSenderId: "596323639753",
            appId: "1:596323639753:web:f4c4a93d1573eb8ab28818"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.dbData = JSON.parse(localStorage.getItem('sz_v11_db') || JSON.stringify({
            user: { name: "Guest", id: "user_" + Date.now(), weight: 65, height: 170, age: 20, avatar: null, groupCode: null, groupName: null },
            records: [],
            todos: [],
            cats: []
        }));

        window.allPosts = [];
        window.currentTLFilter = 'global';
        window.currentRankScope = 'global';
        window.currentRecPhotoData = null;
        window.currentCatId = '';
        window.rankCatId = 'study';
        window.isTodoEditMode = false;

        const baseCats = [
            { id:'weight', name:'体重', icon:'bi-speedometer2', color:'#444', type:'weight', unit:'kg' },
            { id:'meal', name:'食事', icon:'bi-egg-fried', color:'#34c759', type:'val', unit:'kcal' },
            { 
                id:'study', name:'勉強', icon:'bi-book', color:'#0071e3', type:'time', unit:'時間',
                subOptions: ['国語', '数学', '物理', '化学', '英語', '情報', 'その他'] 
            },
            { 
                id:'exercise', name:'運動', icon:'bi-fire', color:'#ff9500', type:'time', unit:'時間', mets:5.0,
                subOptions: ['腹筋', '背筋', '腕立て伏せ', 'プランク', '機械', 'その他'] 
            },
            { id:'run', name:'ランニング', icon:'bi-person-walking', color:'#ff3b30', type:'run', unit:'km', mets:8.3 },
            { id:'diary', name:'日記', icon:'bi-chat-quote', color:'#000', type:'diary', unit:'文字' },
            { id:'sleep', name:'睡眠', icon:'bi-moon-stars', color:'#af52de', type:'sleep', unit:'時間' }
        ];

        const presetIcons = ['bi-book', 'bi-fire', 'bi-person-walking', 'bi-speedometer2', 'bi-chat-quote', 'bi-moon-stars', 'bi-cup-hot', 'bi-heart-pulse', 'bi-controller', 'bi-music-note', 'bi-droplet', 'bi-capsule', 'bi-star-fill', 'bi-trophy', 'bi-bicycle'];
        let selectedIcon = presetIcons[0];

        // Firebase Cloud Methods
        window.cloud = {
            login: async () => {
                if (window.location.protocol === 'file:') {
                    alert("【案内】HTMLファイルを直接開いている（file://）ため、Googleログインがブラウザによりブロックされています。\n下の「ゲストとして試す」を押すか、Webサーバー(http://)でお開きください。");
                    return;
                }
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Firebase Login Error:", error);
                    alert("ログインエラーが発生しました:\n" + error.message);
                }
            },
            logout: () => signOut(auth),
            saveAllUserData: async (uid, data) => {
                try { await setDoc(doc(db, "users", uid), data, { merge: true }); } catch(e) { console.error(e); }
            },
            getUserData: async (uid) => {
                try {
                    const snap = await getDoc(doc(db, "users", uid));
                    return snap.exists() ? snap.data() : null;
                } catch(e) { return null; }
            },
            postTimeline: async (postData) => {
                try { await addDoc(collection(db, "timeline"), { ...postData, likes: [], comments: [], createdAt: Date.now() }); } catch(e) { console.error(e); }
            },
            listenTimeline: (callback) => {
                const q = query(collection(db, "timeline"), orderBy("createdAt", "desc"), limit(50));
                return onSnapshot(q, (snapshot) => {
                    const posts = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                    callback(posts);
                });
            },
            toggleLike: async (docId, uid) => {
                const ref = doc(db, "timeline", docId);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const likes = snap.data().likes || [];
                    if (likes.includes(uid)) {
                        await updateDoc(ref, { likes: arrayRemove(uid) });
                    } else {
                        await updateDoc(ref, { likes: arrayUnion(uid) });
                    }
                }
            },
            addComment: async (docId, commentObj) => {
                const ref = doc(db, "timeline", docId);
                await updateDoc(ref, { comments: arrayUnion(commentObj) });
            },
            // 🌟 タイムライン投稿の完全削除（データベース抹消）
            deleteTimelinePost: async (docId) => {
                await deleteDoc(doc(db, "timeline", docId));
            },
            createGroup: async (groupName, user) => {
                const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                const groupData = { code, name: groupName, hostUid: user.id, members: [{ uid: user.id, name: user.name, avatar: user.avatar }] };
                await setDoc(doc(db, "groups", code), groupData);
                return { code, name: groupName };
            },
            joinGroup: async (code, user) => {
                const ref = doc(db, "groups", code.toUpperCase());
                const snap = await getDoc(ref);
                if (!snap.exists()) return { success: false, msg: "グループが見つかりません" };
                await updateDoc(ref, { members: arrayUnion({ uid: user.id, name: user.name, avatar: user.avatar }) });
                return { success: true, group: snap.data() };
            }
        };

        window.saveRecord = async function() {
            const memo = document.getElementById('rec-comment').value.trim();
            const date = document.getElementById('rec-date').value;
            const time = document.getElementById('rec-time').value;
            let val = 0;
            let durationMin = 0;
            const cat = [...baseCats, ...(window.dbData.cats || [])].find(c => c.id === window.currentCatId);

            let subCatVal = '';
            const subSelect = document.getElementById('v_sub_cat');
            if (subSelect) {
                subCatVal = (subSelect.value === 'その他') ? (document.getElementById('v_sub_other')?.value.trim() || 'その他') : subSelect.value;
            }

            if (window.currentCatId === 'schedule') {
                const task = document.getElementById('v_task_todo').value;
                if (!task) return alert("予定内容を入力してください");
                const sel = document.getElementById('todo-date-sel').value;
                const hasTime = document.getElementById('todo-has-time').checked;
                const exactTime = hasTime ? document.getElementById('todo-exact-time').value : null;

                const targetDate = (sel === 'today') ? date : new Date(new Date(date).setDate(new Date(date).getDate() + 1)).toISOString().split('T')[0];
                window.dbData.todos.push({ id: Date.now(), time: exactTime, task, memo, done: false, date: targetDate, photo: window.currentRecPhotoData });
            } else {
                if (window.currentCatId === 'run') {
                    val = parseFloat(document.getElementById('v_dist')?.value || 0);
                    const hrs = parseFloat(document.getElementById('v_hrs')?.value || 0);
                    const mins = parseFloat(document.getElementById('v_mins')?.value || 0);
                    durationMin = Math.round(hrs * 60 + mins);
                } else if (cat && cat.type === 'time') {
                    val = parseFloat(document.getElementById('v_hrs')?.value || 0) + (parseFloat(document.getElementById('v_mins')?.value || 0) / 60);
                    durationMin = Math.round(val * 60);
                } else if (window.currentCatId === 'sleep') {
                    const s = new Date(document.getElementById('sleep_s_date').value + 'T' + document.getElementById('sleep_s_time').value);
                    const e = new Date(document.getElementById('sleep_e_date').value + 'T' + document.getElementById('sleep_e_time').value);
                    val = (e - s) / 3600000; if (val < 0) val += 24;
                    durationMin = Math.round(val * 60);
                } else if (window.currentCatId === 'diary') {
                    val = memo.length;
                } else {
                    val = parseFloat(document.getElementById('v1')?.value || 0);
                }
                
                if (window.currentCatId === 'weight') window.dbData.user.weight = val;

                let mainValStr = `${val.toFixed(1)} ${cat ? cat.unit : ''}`;
                if (window.currentCatId === 'run') {
                    mainValStr = `${val.toFixed(1)} km (${window.formatTimeShort(durationMin)})`;
                } else if (cat && cat.type === 'time') {
                    mainValStr = window.formatTime(val);
                }

                const post = {
                    id: Date.now(),
                    catId: window.currentCatId,
                    catName: cat ? cat.name : "記録",
                    subCategory: subCatVal,
                    val: val,
                    durationMin: durationMin,
                    valDisp: subCatVal ? `[${subCatVal}] ${mainValStr}` : mainValStr,
                    date: date,
                    time: time,
                    comment: memo,
                    photo: window.currentRecPhotoData,
                    userId: window.dbData.user.id,
                    userName: window.dbData.user.name,
                    userAvatar: window.dbData.user.avatar,
                    groupCode: window.dbData.user.groupCode || null
                };

                window.dbData.records.unshift(post);

                if (window.cloud && window.cloud.postTimeline) {
                    await window.cloud.postTimeline(post);
                }
            }

            window.saveLocal();
            if (window.cloud && window.cloud.saveAllUserData && window.dbData.user.id) {
                await window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);
            }

            window.closeInput();
            alert("保存完了！");
        };

            const temp = window.dbData.todos[index];
            window.dbData.todos[index] = window.dbData.todos[targetIndex];
            window.dbData.todos[targetIndex] = temp;

            window.saveLocal();
            if (window.cloud && window.cloud.saveAllUserData && window.dbData.user.id) {
                window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);

        // 🌟 タイムライン描画 (削除ボタンの完全修正)

        };

        window.handleCreateGroup = async function() {
            const name = prompt("グループ名を入力してください", "勉強グループ");
            if (!name) return;
            const res = await window.cloud.createGroup(name, window.dbData.user);
            window.dbData.user.groupCode = res.code;
            window.dbData.user.groupName = res.name;
            window.saveLocal();
            if (window.cloud.saveAllUserData) await window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);
            window.renderProfilePage();
            alert(`グループを作成しました！\n招待コード: ${res.code}`);
        };

        window.handleJoinGroup = async function() {
            const code = prompt("6桁の招待コードを入力してください");
            if (!code) return;
            const res = await window.cloud.joinGroup(code, window.dbData.user);
            if (res.success) {
                window.dbData.user.groupCode = code.toUpperCase();
                window.dbData.user.groupName = res.group.name;
                window.saveLocal();
                if (window.cloud.saveAllUserData) await window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);
                window.renderProfilePage();
                alert(`グループ「${res.group.name}」に参加しました！`);
            } else {
                alert(res.msg);
            }
        };

        window.renderResultsView = function() {
            const date = document.getElementById('results-date').value;
            const prev = new Date(new Date(date).setDate(new Date(date).getDate() - 1)).toISOString().split('T')[0];
            const all = [...baseCats, ...(window.dbData.cats || [])];

            const grid = document.getElementById('result-sum-grid');
            if (grid) {
                grid.innerHTML = all.filter(c => c.type !== 'todo').map(c => {
                    const curRecs = window.dbData.records.filter(r => r.date === date && r.catId === c.id);
                    const cur = (c.id === 'weight') ? (curRecs[0]?.val || 0) : curRecs.reduce((s, a) => s + a.val, 0);
                    const curMins = curRecs.reduce((s, a) => s + (a.durationMin || 0), 0);
                    
                    const oldRecs = window.dbData.records.filter(r => r.date === prev && r.catId === c.id);
                    const old = (c.id === 'weight') ? (oldRecs[0]?.val || 0) : oldRecs.reduce((s, a) => s + a.val, 0);
                    const diff = cur - old;
                    
                    let valDisp = '';
                    if (c.id === 'run') {
                        valDisp = `${cur.toFixed(1)} km <span class="text-[10px] text-gray-500 font-normal ml-0.5">(${window.formatTimeShort(curMins)})</span>`;
                    } else if (c.type === 'time' || c.type === 'sleep') {
                        valDisp = window.formatTime(cur);
                    } else if (c.type === 'diary') {
                        valDisp = `${cur}文字`;
                    } else {
                        valDisp = `${cur.toFixed(1)} ${c.unit}`;
                    }

                    const diffH = cur === 0 ? '' : (diff > 0 ? `<span class="diff-plus">+${diff.toFixed(1)}</span>` : diff < 0 ? `<span class="diff-minus">${diff.toFixed(1)}</span>` : '±0');
                    
                    return cur > 0 ? `
                        <div class="glass-card p-3 text-center">
                            <p class="text-[8px] font-bold text-gray-400 uppercase">${c.name}</p>
                            <p class="text-sm font-black text-blue-600">${valDisp}</p>
                            ${diffH}
                        </div>
                    ` : '';
                }).join('') || `<p class="col-span-2 text-center text-xs text-gray-400 py-4">この日の記録はありません</p>`;
            }

            const todoList = document.getElementById('result-todo-list');
            if (todoList) {
                todoList.innerHTML = window.dbData.todos.filter(t => t.date === date && t.done).map(t => `
                    <div class="p-2 bg-green-50 dark:bg-green-900/20 text-[10px] rounded-lg text-green-700 dark:text-green-300 font-bold">✓ ${t.task}</div>
                `).join('') || `<p class="text-center text-xs text-gray-400">達成した予定はありません</p>`;
            }
        };

        window.toggleTodo = function(id) {
            const t = window.dbData.todos.find(x => x.id === id);
            if (t) {
                t.done = !t.done;
                window.saveLocal();
                if (window.cloud && window.cloud.saveAllUserData && window.dbData.user.id) {
                    window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);
                }
            }
        };

        // 🌟 カロリー計算 (身長・体重・年齢プロフ連動)
        window.updatePreCal = function() {
            const h = parseFloat(document.getElementById('v_hrs')?.value || 0);
            const m = parseFloat(document.getElementById('v_mins')?.value || 0);
            const totalHours = h + (m / 60);
            const cat = baseCats.find(c => c.id === window.currentCatId);
            
            if (cat && cat.mets && totalHours > 0) {
                const w = window.dbData.user.weight || 65;
                const cal = Math.round(cat.mets * w * totalHours * 1.05);
                document.getElementById('cal-val').innerText = `${cal} kcal`;
                document.getElementById('calorie-preview').classList.remove('hidden');
            } else {
                document.getElementById('calorie-preview').classList.add('hidden');
            }
        };

        window.formatTime = function(h) {
            const hr = Math.floor(h);
            const mn = Math.round((h - hr) * 60);
            return hr > 0 ? `${hr}h ${mn}m` : `${mn}m`;
        };

        window.formatTimeShort = function(mins) {
            if (!mins) return '0m';
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        };

        window.saveSettings = async function() {
            window.dbData.user.name = document.getElementById('set-name').value;
            window.dbData.user.weight = parseFloat(document.getElementById('set-weight').value || 65);
            window.dbData.user.height = parseFloat(document.getElementById('set-height').value || 170);
            window.dbData.user.age = parseInt(document.getElementById('set-age').value || 20);
            
            window.saveLocal();
            if (window.cloud && window.cloud.saveAllUserData && window.dbData.user.id) {
                await window.cloud.saveAllUserData(window.dbData.user.id, window.dbData);
                alert("設定を保存しました！");
            }
        };

        window.handleAvatarFileSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                window.dbData.user.avatar = ev.target.result;
                document.getElementById('set-avatar-preview').src = ev.target.result;
                window.saveLocal();
            };
            r.readAsDataURL(file);
        };

        window.renderProfilePage = function() {
            const u = window.dbData.user;
            const area = document.getElementById('profile-header-area');
            if (area) {
                area.innerHTML = `
                    <div class="glass-card p-6 mb-6 flex flex-col items-center text-center">
                        <img src="${u.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name)}" class="w-20 h-20 rounded-full border-4 border-white shadow-xl object-cover">
                        <h2 class="text-xl font-black mt-4">${u.name}</h2>
                        <p class="text-[10px] text-gray-400">UID: ${u.id}</p>
                    </div>`;
            }

            const gInfo = document.getElementById('my-group-info');
            if (gInfo) {
                if (u.groupCode) {
                    gInfo.innerHTML = `<p class="font-bold text-green-600">所属: ${u.groupName || 'グループ'} <span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-mono text-sm ml-1">${u.groupCode}</span></p>`;
                } else {
                    gInfo.innerHTML = `<p class="text-gray-400">グループに未所属です</p>`;
                }
            }
        };

        window.updateRankList = function(id) {
            const u = window.dbData.user;
            window.rankCatId = id;

            const cat = baseCats.find(c => c.id === window.rankCatId) || baseCats[0];
            const unitStr = cat ? cat.unit : '';

            const scopeTabs = document.getElementById('rank-scope-tabs');
            if (scopeTabs) {
                scopeTabs.innerHTML = `
                    <button onclick="window.setRankScope('global')" class="chip ${window.currentRankScope === 'global' ? 'active' : ''}">🌐 グローバル</button>
                    ${u.groupCode ? `<button onclick="window.setRankScope('group')" class="chip ${window.currentRankScope === 'group' ? 'active' : ''}">👥 グループ内 (${u.groupName || u.groupCode})</button>` : ''}
                `;
            }

            const filters = document.getElementById('rank-filters');
            if (filters) {
                filters.innerHTML = baseCats.filter(c => c.type !== 'todo').map(c => `
                    <button onclick="window.updateRankList('${c.id}')" class="chip ${window.rankCatId === c.id ? 'active' : ''}">${c.name}</button>
                `).join('');
            }
            
            const myV = window.dbData.records.filter(r => r.catId === window.rankCatId).reduce((s, a) => s + a.val, 0);
            
            let valFormatted = `${myV.toFixed(1)} ${unitStr}`;
            if (cat && (cat.type === 'time' || cat.type === 'sleep')) {
                valFormatted = window.formatTime(myV);
            } else if (cat && cat.type === 'diary') {
                valFormatted = `${myV} 文字`;
            }

            const display = document.getElementById('ranking-display');
            if (display) {
                display.innerHTML = `
                    <div class="flex items-center p-4 bg-white/50 dark:bg-white/5">
                        <span class="w-8 font-black text-yellow-500">1</span>
                        <span class="flex-1 font-bold text-sm">${window.dbData.user.name} (あなた)</span>
                        <span class="font-black text-blue-600 text-xs">${valFormatted}</span>
                    </div>`;
            }
        };

        window.setRankScope = function(scope) {
            window.currentRankScope = scope;
            window.updateRankList(window.rankCatId);
        };

        // Firebase Auth 監視
        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appShell = document.getElementById('app-shell');

            if (user) {
                loginScreen.style.display = 'none';
                appShell.style.display = 'block';

                window.dbData.user.name = user.displayName || window.dbData.user.name || "User";
                window.dbData.user.id = user.uid;
                window.dbData.user.avatar = user.photoURL || window.dbData.user.avatar;

                window.initApp();

                try {
                    const cloudData = await window.cloud.getUserData(user.uid);
                    if (cloudData) {
                        window.dbData = { ...window.dbData, ...cloudData };
                        window.saveLocal();
                        window.initApp();
                    }
                    await window.cloud.saveAllUserData(user.uid, window.dbData);
                } catch(e) {
                    console.warn("クラウド同期処理スキップ:", e);
                }

                try {
                    window.cloud.listenTimeline((posts) => {
                        window.allPosts = posts;
                        window.renderTimeline();
                    });
                } catch(e) {
                    console.warn("TL受信スキップ:", e);
                }
            } else {
                loginScreen.style.display = 'flex';
                appShell.style.display = 'none';
            }
        });
    </script>
</body>
</html>
